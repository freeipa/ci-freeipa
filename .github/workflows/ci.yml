name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends qemu-utils podman python3-yaml python3-pytest
      - name: Tests
        run: python3 -m pytest env/tests -q

  # The same suite on macOS: proves the control-node Python is macOS-clean
  # (the qemu backend's ps fallback, no /proc, no /dev/kvm). No VMs here:
  # GitHub macOS runners cannot use Hypervisor.framework.
  unit-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          python3 -m venv "$HOME/ci-venv"
          "$HOME/ci-venv/bin/pip" install --quiet pytest pyyaml
      - name: Tests
        run: |
          "$HOME/ci-venv/bin/python" -m pytest env/tests -q

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build, install and smoke-test the package
        run: |
          python3 -m venv "$HOME/pkg-venv"
          "$HOME/pkg-venv/bin/pip" install --quiet .
          "$HOME/pkg-venv/bin/freeipa-env" --help >/dev/null
          "$HOME/pkg-venv/bin/python" - <<'PY'
          import os, sys
          from freeipa_env import paths
          assert os.path.isdir(os.path.join(paths.ENVROOT, 'presets'))
          script = os.path.join(paths.ENVROOT, 'freeipa-env')
          assert os.access(script, os.X_OK), script
          print('installed tree:', paths.CI_ROOT)
          PY
          "$HOME/pkg-venv/bin/freeipa-env" check

  # Native aarch64 image build (no emulation): proves --distarch bakes an
  # arm64 channel image with the provenance label.
  arm-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the aarch64 channel image
        run: bash images/build.sh --dist 45 --tag freeipa-ci --ipa-from-distro --distarch aarch64
      - name: Check the image architecture
        run: |
          arch="$(podman image inspect freeipa-ci/full:45 --format '{{.Architecture}}')"
          [ "$arch" = arm64 ] || { echo "::error::architecture is $arch, expected arm64"; exit 1; }

  # The published images are multi-arch manifests: proves the arm64 member
  # of the tag the presets reference resolves and is pulled as arm64. No VM
  # here (the GitHub arm runners have no KVM): the pull and the arch check
  # are what this side of the flow needs.
  containerdisk-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull the published image for the host arch
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends podman python3-pytest qemu-utils
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'env')
          from freeipa_env import containerdisk
          disk = containerdisk.resolve(
              'containerdisk:ghcr.io/freeipa/ci-freeipa-vm-images/'
              'fedora-45:latest')
          print(f'resolved: {disk}')
          PY
          arch="$(podman image inspect \
              ghcr.io/freeipa/ci-freeipa-vm-images/fedora-45:latest \
              --format '{{.Architecture}}')"
          [ "$arch" = arm64 ] || { echo "::error::architecture is $arch, expected arm64"; exit 1; }

  # Boots a VM from the published Fedora 45 image and installs a FreeIPA
  # server on it with this checkout's freeipa-env: the qemu backend, the
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRESET: env/presets/qemu-smoke.yaml
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the host
        run: |
          # let the runner user use KVM; load the module first, since a
          # runner may not have loaded it
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          for _ in $(seq 15); do [ -w /dev/kvm ] && break; sleep 2; done
          if [ ! -w /dev/kvm ]; then
              ls -l /dev/kvm* 2>&1 || true
              lscpu | grep -i -E 'model name|hypervisor|virtualization' || true
              echo "::error::/dev/kvm is not available on this runner (no nested virtualization)"
              exit 1
          fi
          # azure.archive.ubuntu.com, the runner's default mirror, sometimes
          # does not resolve: use the main archive, then kernel.org's mirror
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
              /etc/apt/sources.list.d/* 2>/dev/null || true
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
              # shellcheck disable=SC2086
              sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends \
                  qemu-system-x86 qemu-utils xorriso rsync openssh-client podman python3-yaml && break
              [ "$attempt" = 3 ] && { echo "::error::apt is unreachable"; exit 1; }
              echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo sed -i -E 's#https?://([a-z]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
                  /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
              sleep 10
          done
          # the VMs authorize the runner's ssh key
          [ -e ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          mkdir -p "$WORK"

      - name: Test - install a FreeIPA server on the published image
        run: |
          cli=env/freeipa-env
          wd=(--workdir "$WORK/env")
          rc=0
          "$cli" up "$PRESET" "${wd[@]}" && "$cli" run "$PRESET" "${wd[@]}" || rc=$?
          "$cli" summary "$PRESET" "${wd[@]}" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          "$cli" down "$PRESET" "${wd[@]}" || true
          exit $rc

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: work/env/logs
          retention-days: 14
          if-no-files-found: ignore

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-freeipa"
description = "freeipa-env: provision and drive FreeIPA CI environments"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = ["PyYAML"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/freeipa/ci-freeipa"

[project.scripts]
freeipa-env = "freeipa_env.cli:main"

[tool.setuptools]
package-dir = {"" = "env"}
packages = ["freeipa_env"]

[tool.setuptools.dynamic]
version = {attr = "freeipa_env.__version__"}
